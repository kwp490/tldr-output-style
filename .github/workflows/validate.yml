name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  manifests:
    name: Manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse JSON manifests
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty plugins/tldr/.claude-plugin/plugin.json

      - name: Plugin source path exists
        run: |
          src=$(jq -r '.plugins[] | select(.name == "tldr") | .source' .claude-plugin/marketplace.json)
          test -d "$src" || { echo "marketplace.json source '$src' is not a directory"; exit 1; }
          test -f "$src/.claude-plugin/plugin.json" || { echo "no plugin.json under '$src'"; exit 1; }

      - name: Versions agree across manifests
        run: |
          mkt=$(jq -r '.plugins[] | select(.name == "tldr") | .version' .claude-plugin/marketplace.json)
          plg=$(jq -r '.version' plugins/tldr/.claude-plugin/plugin.json)
          echo "marketplace.json: $mkt"
          echo "plugin.json:      $plg"
          if [ "$mkt" != "$plg" ]; then
            echo "::error::version drift — marketplace.json says '$mkt', plugin.json says '$plg'"
            exit 1
          fi

      - name: Names agree across manifests
        run: |
          mkt=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
          plg=$(jq -r '.name' plugins/tldr/.claude-plugin/plugin.json)
          if [ "$mkt" != "$plg" ]; then
            echo "::error::name mismatch — marketplace.json says '$mkt', plugin.json says '$plg'"
            exit 1
          fi

      - name: Demo assets exist and the script parses
        run: |
          # DEMO.md and the README both link these. Broken links here mean a
          # visitor's first attempt to try the plugin fails.
          for f in DEMO.md demo/prompt.md demo/demo.sh demo/demo.ps1; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          bash -n demo/demo.sh

      - name: Eval cases exist and each has at least one grader
        run: |
          # This job never RUNS an eval. A GitHub runner has nobody logged in,
          # so executing a case would need an API key secret in a public repo.
          # These checks are file-shape only and need no auth.
          test -f evals/README.md || { echo "::error::missing evals/README.md"; exit 1; }
          for c in evals/01-messy-email evals/02-casual-question evals/03-explain-break-glass; do
            test -f "$c/prompt.md" || { echo "::error::missing $c/prompt.md"; exit 1; }
            n=$(find "$c/graders" -maxdepth 1 -name '*.md' | wc -l)
            [ "$n" -ge 1 ] || { echo "::error::$c has no graders"; exit 1; }
          done

      - name: Ablation stays wired up in every case
        run: |
          # Without a `plugins:` declaration the runner refuses to run the
          # baseline arm, and the suite silently stops measuring uplift.
          for f in evals/*/prompt.md; do
            grep -q '^plugins:' "$f" || {
              echo "::error::$f has no 'plugins:' frontmatter — --ablation with-without would abort"
              exit 1
            }
          done

      - name: Eval fixture matches the demo fixture
        run: |
          # The eval sandbox cannot read demo/, so the email is duplicated into
          # the case. Fail the build if the two copies drift apart.
          f=evals/01-messy-email/prompt.md
          awk 'BEGIN{n=0} /^---$/{n++; if(n<=2) next} n>=2{print}' "$f" > eval-body.md
          if ! diff -u demo/prompt.md eval-body.md; then
            echo "::error::$f has drifted from demo/prompt.md — copy the change across"
            exit 1
          fi
          rm -f eval-body.md

  style:
    name: Output style frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required frontmatter keys are present
        run: |
          f=plugins/tldr/output-styles/tldr.md
          test -f "$f" || { echo "missing $f"; exit 1; }
          head -1 "$f" | grep -qx -- '---' || { echo "$f does not open with YAML frontmatter"; exit 1; }
          fm=$(awk 'NR>1 && /^---$/{exit} NR>1{print}' "$f")
          for key in name description keep-coding-instructions force-for-plugin; do
            echo "$fm" | grep -q "^${key}:" || { echo "::error::frontmatter missing '${key}'"; exit 1; }
          done

      - name: force-for-plugin stays true
        run: |
          # The README promises the style self-applies with no manual outputStyle step.
          # If this flips to false, that promise silently breaks for every installer.
          fm=$(awk 'NR>1 && /^---$/{exit} NR>1{print}' plugins/tldr/output-styles/tldr.md)
          echo "$fm" | grep -qx -- 'force-for-plugin: true' || {
            echo "::error::force-for-plugin is not true — README's no-second-step promise would break"
            exit 1
          }

  cli:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # Blocking. Proven on a cold runner in run 31493764691: `plugin validate`
    # is a local manifest check and needs no auth or onboarding.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
